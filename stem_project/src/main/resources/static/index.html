<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEM Project - Product Portal</title>
    <style>
        /* --- CSS STYLES --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 100%;
            min-height: 500px;
        }

        h1, h2, h3 { color: #333; margin-bottom: 15px; }
        h1 { text-align: center; }

        .login-section { text-align: center; margin-top: 80px; }
        .hidden { display: none !important; }

        /* BUTTONS */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin: 5px;
        }
        .btn:hover { transform: translateY(-2px); }
        .google-btn { background: #fff; color: #444; border: 1px solid #ddd; display: inline-flex; align-items: center; gap: 10px; padding: 12px 25px; }
        .logout-btn { background: #f44336; color: white; float: right; padding: 8px 15px; font-size: 14px;}
        .delete-btn { background: #ff4444; color: white; padding: 6px 12px; font-size: 13px; margin-top: 15px; width: 100%; }

        /* DASHBOARD LAYOUT */
        .dashboard { display: none; }

        /* CARDS */
        .data-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .data-card h3 {
            color: #667eea;
            font-size: 18px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            min-height: 40px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 16px;
        }
        .label { font-weight: 600; color: #555; }
        .value { color: #333; font-weight: bold; }

        /* GRIDS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        /* UTILS */
        .error-msg { color: white; background: #e53935; padding: 10px; border-radius: 5px; margin: 10px 0; display: none; text-align: center;}
        #products-section { margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div id="error-box" class="error-msg"></div>

    <div id="loginSection" class="login-section">
        <h1>STEM Portal Login</h1>
        <p>Access the Product Catalog</p>
        <br>
        <button class="btn google-btn" onclick="window.signInWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
            <span>Sign in with Google</span>
        </button>
    </div>

    <div id="dashboard" class="dashboard">
        <div style="overflow: hidden; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 15px;">
            <button class="logout-btn" onclick="window.logout()">Logout</button>
            <h2 id="welcome-msg" style="text-align: left; margin: 0;">Product Dashboard</h2>
        </div>

        <div id="products-section">
            <h3>🛒 Product Catalog</h3>
            <div id="product-list" class="stats-grid">
                <p>Loading products...</p>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import {
        getAuth,
        signInWithPopup,
        GoogleAuthProvider,
        onIdTokenChanged, // <--- CHANGED FROM onAuthStateChanged
        signOut
    } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    // --- CONFIGURATION ---
    const firebaseConfig = {
        apiKey: "AIzaSyDCK8NZcc-66WGB83PHlO2ryFPmPUzG1b8",
        authDomain: "hoolistem.firebaseapp.com",
        projectId: "hoolistem",
        storageBucket: "hoolistem.firebasestorage.app",
        messagingSenderId: "610097991402",
        appId: "1:610097991402:web:0ac68ab57d013b33a91193",
        measurementId: "G-PC4CGN6JDK"
    };

    const API_BASE_URL = 'http://localhost:8080/api';
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // --- 1. LOGIN ACTION ---
    window.signInWithGoogle = async function() {
        try {
            await signInWithPopup(auth, provider);
            // We don't need to do anything else here.
            // onIdTokenChanged will detect the new user and handle the backend sync.
        } catch (error) {
            console.error("Login failed:", error);
            showError(error.message);
        }
    };

    // --- 2. AUTH SYNC & REFRESH HANDLER ---
    // Triggers on: Login, Page Refresh, AND Token Refresh (every ~55 mins)
    onIdTokenChanged(auth, async (user) => {
        if (user) {
            console.log("Auth State: Active for", user.email);

            try {
                // Step A: Get the latest token
                const idToken = await user.getIdToken();

                // Step B: Send to backend to Set/Overwrite the Cookie
                // This resets the 1-hour expiration timer on the server
                const res = await fetch(`${API_BASE_URL}/auth/check-user`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken: idToken }),
                    credentials: 'include' // CRITICAL for Cookies
                });

                if (!res.ok) throw new Error("Backend sync failed");

                // Step C: Cookie is valid, show dashboard
                initDashboard();

            } catch (err) {
                console.error("Sync Error:", err);
                showError("Session sync failed. Please login again.");
                // window.logout(); // Optional: Force logout on sync failure
            }

        } else {
            // User is logged out
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('loginSection').classList.remove('hidden');
        }
    });

    // --- 3. DASHBOARD LOGIC ---
    function initDashboard() {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('dashboard').style.display = 'block';

        // Only load products if not already loaded (prevents flicker on token refresh)
        const list = document.getElementById('product-list');
        if (list.innerHTML.includes("Loading")) {
            loadProducts();
        }
    }

    async function loadProducts() {
        const container = document.getElementById('product-list');
        try {
            const res = await fetch(`${API_BASE_URL}/products/get`, {
                method: 'GET',
                credentials: 'include'
            });

            // If cookie is invalid/expired
            if (res.status === 401 || res.status === 403) {
                console.warn("Access denied. Logging out.");
                window.logout();
                return;
            }

            if (!res.ok) throw new Error("Failed to load products");

            const products = await res.json();

            if (products.length === 0) {
                container.innerHTML = "<p>No products found.</p>";
                return;
            }

            container.innerHTML = products.map(p => `
                <div class="data-card" style="text-align: left;">
                    <h3>${p.product_name || p.productName || 'Unknown Item'}</h3>
                    <div class="row">
                        <span class="label">Price:</span>
                        <span class="value">$${p.price || 0}</span>
                    </div>
                    <button class="btn delete-btn" onclick="window.deleteProduct(${p.id})">🗑 Delete</button>
                </div>
            `).join('');

        } catch (e) {
            console.error(e);
            container.innerHTML = `<p style="color:red">Error loading products.</p>`;
        }
    }

    // --- 4. ACTIONS ---
    window.deleteProduct = async function(id) {
        if(!confirm("Are you sure you want to delete this product?")) return;

        try {
            const res = await fetch(`${API_BASE_URL}/products/${id}`, {
                method: 'DELETE',
                credentials: 'include'
            });

            if(res.ok) {
                loadProducts();
            } else {
                alert("Failed to delete. Check permissions.");
            }
        } catch(e) {
            console.error(e);
            alert("Error connecting to server");
        }
    };

    window.logout = async function() {
        try {
            // 1. Clear Backend Cookie
            await fetch(`${API_BASE_URL}/auth/logout`, {
                method: 'POST',
                credentials: 'include'
            });

            // 2. Clear Frontend Session
            await signOut(auth);
            location.reload();
        } catch(e) {
            console.error("Logout error", e);
            location.reload();
        }
    };

    function showError(msg) {
        const errBox = document.getElementById('error-box');
        errBox.innerText = msg;
        errBox.style.display = 'block';
        setTimeout(() => errBox.style.display = 'none', 5000);
    }
</script>
</body>
</html>
