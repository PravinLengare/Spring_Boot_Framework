<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>TO DO Application</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        /* Define a consistent accent color variable */
        :root {
            --primary-accent: #6a11cb; /* A vibrant purple */
            --primary-accent-dark: #2575fc; /* A deeper blue for gradients */
            --text-dark: #2c3e50;
            --text-light-grey: #8d9bb3;
            --bg-light-grey: #f0f2f5;
            --danger-red: #dc3545;
            --danger-red-dark: #b02a37;
        }

        /* 1. Global & Typography */
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-light-grey);
            background-image: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            padding-top: 3.5rem; /* Increased padding top */
            min-height: 100vh;
            display: flex; /* Centering the container vertically */
            justify-content: center;
            align-items: flex-start; /* Align to start, not center, for natural flow */
        }

        h1 {
            font-weight: 700;
            color: var(--text-dark);
            font-size: 2.2rem; /* Slightly larger title */
        }

        /* 2. Main App Container */
        .container {
            max-width: 850px; /* Slightly wider container */
            background-color: rgba(255, 255, 255, 0.98); /* Less transparent */
            border-radius: 20px; /* More rounded */
            padding: 3rem; /* Increased padding inside container */
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1); /* Stronger, softer shadow */
            backdrop-filter: blur(15px); /* Stronger blur */
            border: 1px solid rgba(255, 255, 255, 0.3); /* Lighter, more subtle border */
        }

        /* 3. Header Wrapper */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0; /* Remove top margin as container now has it */
            margin-bottom: 2.5rem; /* Increased bottom margin */
        }

        .app-header h1 {
            margin: 0;
            flex-grow: 1; /* Allow h1 to take available space */
        }

        /* *
         * CHANGE HERE: Updated .btn-logout to a red outline style
         *
         */

        /* 4. Logout Button */
        .btn-logout {
            background-color: transparent;
            border: 1px solid var(--danger-red); /* Red border */
            color: var(--danger-red); /* Red text */
            border-radius: 8px;
            padding: 0.4rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            background-color: var(--danger-red); /* Red background on hover */
            color: #fff; /* White text on hover */
            box-shadow: 0 2px 8px rgba(220, 53, 69, 0.3); /* Add a subtle red shadow */
        }

        /* 5. Form & Input */
        .form-control-lg {
            border-radius: 12px; /* More rounded input */
            padding: 0.9rem 1.5rem; /* More generous padding */
            border: 1px solid #e0e6ed; /* Lighter border color */
            transition: all 0.3s ease;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.05); /* Subtle inner shadow */
        }

        .form-control-lg:focus {
            border-color: var(--primary-accent-dark); /* Accent color on focus */
            box-shadow: 0 0 0 4px rgba(106, 17, 203, 0.15); /* More vibrant shadow */
            transform: scale(1.005); /* Very subtle scale */
        }

        /* 6. Add Task Button */
        .btn-primary.btn-lg {
            border-radius: 12px; /* Matching input */
            padding: 0.9rem 1.5rem; /* Matching input */
            font-weight: 600;
            width: 100%;
            /* More dynamic gradient */
            background-image: linear-gradient(to right, var(--primary-accent) 0%, var(--primary-accent-dark) 100%);
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(106, 17, 203, 0.3); /* Stronger shadow */
            letter-spacing: 0.5px; /* Slightly spaced letters */
        }

        .btn-primary.btn-lg:hover {
            transform: translateY(-3px); /* More pronounced lift */
            box-shadow: 0 10px 25px rgba(106, 17, 203, 0.4);
            background-image: linear-gradient(to right, var(--primary-accent-dark) 0%, var(--primary-accent) 100%); /* Reverse gradient on hover */
        }

        /* 7. Task List Items (Cards) */
        .card {
            border: none;
            border-radius: 12px; /* Consistent rounded corners */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08); /* Softer shadow */
            transition: all 0.3s ease-in-out;
            border-left: 6px solid transparent; /* Thicker accent border */
            background-color: #ffffff;
        }

        .card:hover {
            transform: translateY(-3px); /* Slight lift */
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            border-left-color: var(--primary-accent); /* Accent on hover */
        }

        .card-body {
            padding: 1.2rem 1.8rem; /* Adjusted padding */
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-body span {
            font-size: 1.05rem; /* Slightly smaller for better fit */
            font-weight: 500; /* Regular weight for main text */
            color: var(--text-dark);
            flex-grow: 1; /* Allow text to grow */
            margin-right: 1rem; /* Space between text and buttons */
        }

        /* 8. Utility Styles */
        .text-strikethrough {
            text-decoration: line-through;
            color: var(--text-light-grey); /* Using CSS variable */
            font-weight: 400;
            font-style: italic; /* Added italic for completed tasks */
        }

        /* 9. Action Button Enhancements */
        .btn-sm {
            font-weight: 600;
            border-radius: 8px; /* Consistent rounding */
            padding: 0.3rem 0.9rem; /* Adjusted padding */
            font-size: 0.85rem; /* Slightly smaller font */
            transition: all 0.2s ease;
            white-space: nowrap; /* Prevent buttons from wrapping text */
        }

        .btn-outline-secondary {
            border-color: #ced4da;
            color: #6c757d;
        }

        .btn-outline-secondary:hover {
            background-color: #6c757d;
            border-color: #6c757d;
            color: #fff;
            transform: translateY(-1px);
        }

        .btn-outline-danger {
            border-color: var(--danger-red);
            color: var(--danger-red);
            margin-left: 0.75rem; /* Adjusted margin */
        }

        .btn-outline-danger:hover {
            background-color: var(--danger-red);
            border-color: var(--danger-red);
            color: #fff;
            transform: translateY(-1px);
        }

        /* 10. Responsive Adjustments */
        @media (max-width: 767px) {
            body {
                padding-top: 2rem;
            }
            .container {
                padding: 1.5rem;
                border-radius: 15px;
            }

            .app-header {
                flex-direction: column;
                align-items: flex-start; /* Align header items to start */
                margin-bottom: 1.5rem;
            }

            .app-header h1 {
                font-size: 1.8rem;
                margin-bottom: 1rem; /* Space below title */
            }

            form[th:action*="logout"] {
                width: auto; /* Allow button to size naturally */
                margin-top: 0;
            }

            form[th:action*="logout"] button {
                width: auto;
                align-self: flex-end; /* Align logout to right */
            }

            .row.mt-3.mb-4 { /* Target the form row */
                margin-top: 1rem !important;
                margin-bottom: 1.5rem !important;
            }

            .form-control-lg {
                padding: 0.7rem 1rem;
                font-size: 0.9rem;
            }

            .btn-primary.btn-lg {
                margin-top: 1rem;
                padding: 0.7rem 1rem;
                font-size: 0.9rem;
            }

            .card-body {
                flex-direction: column;
                align-items: flex-start !important;
                padding: 1rem;
            }
            .card-body span {
                margin-bottom: 0.75rem; /* Space between text and buttons */
                font-size: 1rem;
                margin-right: 0; /* Remove right margin */
            }
            .card-body div {
                margin-top: 0;
                width: 100%;
                display: flex;
                justify-content: flex-end;
            }
            .btn-outline-danger {
                margin-left: 0.5rem;
            }
        }

        /* Smaller screens only (e.g., very small phones) */
        @media (max-width: 400px) {
            .app-header {
                align-items: center; /* Center header items */
            }
            .app-header h1 {
                text-align: center;
                width: 100%;
            }
            form[th:action*="logout"] {
                width: 100%; /* Make logout button full width */
            }
            .card-body div {
                justify-content: center; /* Center buttons on very small screens */
            }
        }
    </style>
</head>
<body>

<div class = "container">



    <div class="app-header">
        <h1>YOUR TO DO'S </h1>



        <form th:action="@{/logout}" method="post">


            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />
            <button type="submit" class="btn btn-logout">Logout</button>
        </form>
    </div>




    <form th:action="@{/tasks}" method="post" class = "row mb-4 align-items-center">
        <div class="col-md-9">
            <input class="form-control form-control-lg" type="text" name="title" placeholder="Add a new task..." required>
        </div>
        <div class="col-md-3">
            <button type="submit" class="btn btn-primary btn-lg btn-block">Add Task</button>
        </div>



        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}" />

    </form>



    <div>

        <th:block th:each="task : ${tasks}">
            <div class="card mb-3">
                <div class="card-body">
                    <span th:classappend="${task.completed} ?  'text-strikethrough'" th:text="${task.title}">Task Title</span>
                    <div>
                        <a th:href = "@{/tasks/{id}/toggle(id=${task.id})} " class="btn btn-outline-secondary btn-sm" th:text="${task.completed} ? 'Undo' : 'Complete'">Toggle</a>
                        <a th:href = "@{/tasks/{id}/delete(id=${task.id})} " class="btn btn-outline-danger btn-sm">Delete</a>
                    </div>
                </div>
            </div>
        </th:block>
    </div>

</div>
</body>
</html>
