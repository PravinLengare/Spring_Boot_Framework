<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Student Management System</title>

    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">

    <style>
        /* Custom style for the logout button in the navbar */
        .nav-logout-btn {
            display: inline-block;
            padding: 0.4rem 0.75rem; /* Sizing for the navbar */
            font-size: 0.9rem;       /* Sizing for the navbar */
            font-weight: 400;
            line-height: 1.5;
            text-align: center;
            vertical-align: middle;
            cursor: pointer;

            background-color: #d9534f; /* Red color from your dashboard */
            color: white;             /* White text */
            border: 1px solid transparent;
            border-radius: 0.25rem;   /* Standard border-radius */
            transition: background-color 0.15s ease-in-out;
        }

        .nav-logout-btn:hover {
            background-color: #c9302c; /* A darker red on hover */
            color: white;
        }

        /* Helper class to make the form sit nicely in the navbar */
        .nav-logout-form {
            margin-bottom: 0; /* Remove default form margin */
        }
    </style>

</head>
<body>
<nav class="navbar navbar-expand-md bg-dark navbar-dark">
    <a class="navbar-brand" href="#">Student Management System</a>

    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="collapsibleNavbar">
        <ul class="navbar-nav">

            <li class="nav-item">
                <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/students}">Student Management</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/teachers}">Teacher Management</a>
            </li>
        </ul>

        <ul class="navbar-nav ml-auto">
            <li class="nav-item">
                <form th:action="@{/logout}" method="post" class="nav-logout-form">
                    <button type="submit" class="nav-logout-btn">Logout</button>
                </form>
            </li>
        </ul>

    </div>
</nav>

<div class ="container">
    <div class = "row">
        <h1> Student Info </h1>
    </div>

    <div class = "row">
<!--        <div class = "col-lg-3">-->
<!--            <a th:href = "@{/students/new}" class = "btn btn-primary btn-sm mb-3"> Add Student</a>-->
<!--        </div>-->

        <div class = "col-lg-3">
            <a th:href = "@{/tasks}" class = "btn btn-success btn-sm mb-3"> Add Task</a>
        </div>
    </div>
    <table class = "table table-striped table-bordered">
        <thead class = "table-dark">
        <tr>
            <th> Student First Name</th>
            <th> Student Last Name</th>
            <th> Student Email </th>
            <th> Actions </th>
        </tr>
        </thead>

        <tbody>
        <tr th:each = "student: ${students}">
            <td th:text = "${student.firstName}"></td>
            <td th:text = "${student.lastName}"></td>
            <td th:text = "${student.email}"></td>
            <td>
                <a th:href = "@{/students/edit/{user_id}(user_id=${student.user_id})}"
                   class = "btn btn-primary">Update</a>

                <a th:href = "@{/students/delete/{user_id}(user_id=${student.user_id})}"
                   class = "btn btn-danger">Delete</a>

            </td>
        </tr>
        </tbody>

    </table>

</div>
</body>
</html>
